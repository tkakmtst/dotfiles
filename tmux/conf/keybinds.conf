# キーバインド

# 設定リロード
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# セッション切り替え (fzf モーダル)
bind s display-popup -E -w 60% -h 50% \
  "tmux list-sessions -F '#{session_name}: #{session_windows} windows (#{session_attached} attached)' \
  | fzf --reverse --header='Switch Session' --preview='tmux capture-pane -ep -t {1}' --preview-window=right:50% \
  | cut -d: -f1 \
  | xargs -I{} tmux switch-client -t {}"

# ペインリサイズ (prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# copy-mode を vim ライクに
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
