# マウス操作を有効化（スクロール、ペイン選択、リサイズ）
set -g mouse on

# vi モードを有効化（コピーモードで Space で選択開始）
setw -g mode-keys vi

# アクティブパネルの強調（LazyVimの背景色を尊重）
# 背景色は変えず、テキスト色だけで区別
set -g window-style fg=colour245
set -g window-active-style fg=colour255

# ボーダーの色で視覚的に区別
set -g pane-active-border-style fg=blue,bold
set -g pane-border-style fg=colour238
